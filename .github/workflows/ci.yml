name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "25"
          elixir-version: "1.14"
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test
      - run: mix run -e 'ids = Raft.start(["a","b","c"]); {:ok, l} = Raft.Cluster.wait_for_leader(ids); {:ok, _} = Raft.Server.command(l, {:put, :answer, 42}); IO.inspect(Raft.Server.read(l, :answer), label: "read from leader")'
